name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python3 host/test_host.py
      - run: node --test test/*.test.mjs
      - run: bash scripts/build-zip.sh
