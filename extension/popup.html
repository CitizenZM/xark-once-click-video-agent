<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Xark Once Click Video Agent</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header>
  <img src="icon.png" alt="" width="22" height="22">
  <b>Xark Video Agent</b>
  <span id="helper" class="dot" title="Checking helper…"></span>
</header>
<section id="now" class="now"><div class="state">Looking for a video…</div><div class="sub"></div></section>
<div class="actions">
  <button id="sel"><span>☑</span> Select videos</button>
  <button id="dash"><span>▤</span> Dashboard</button>
</div>
<section class="queue">
  <div class="qhead"><b>Queue</b> <span id="qsum" class="mute"></span><button id="pause" class="link">⏸ Pause</button><button id="clear" class="link" hidden>Clear finished</button></div>
  <ul id="jobs"></ul>
  <div class="qtools"><button id="export" class="link" hidden>Export last batch (CSV)</button></div>
</section>
<footer><label><input type="checkbox" id="auto"> Download as soon as I click the icon</label></footer>
<script type="module" src="popup.js"></script>
</body></html>
